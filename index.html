<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1c2b4a" />
    <meta name="description" content="Estudia el temario y ponte a prueba con tests estilo oposición para el Cuerpo General Administrativo del Estado (C1)." />
    <title>Chuleta C1</title>
    <!--
      %BASE_URL% (sustituido por Vite en build) — nunca una ruta absoluta
      "/xxx" a secas: en GitHub Pages la app vive bajo "/chuleta-c1/", y una
      ruta absoluta apuntaría por error a la raíz del dominio. Ver
      docs/adr/0005-github-pages-deployment.md.

      El <link rel="manifest"> ya NO se escribe a mano aquí: desde la
      Fase 4, vite-plugin-pwa lo inyecta automáticamente (con la ruta
      correcta según `base`) al generar `manifest.webmanifest` — ver
      vite.config.ts y docs/PWA_ARCHITECTURE.md. Escribirlo también aquí
      duplicaría la etiqueta.

      Fase 4, punto 3 (runtime completamente local): las fuentes de
      Google Fonts (fonts.googleapis.com/fonts.gstatic.com) se han
      retirado — la app no debe depender de ningún CDN en tiempo de
      ejecución para funcionar offline. Ver src/theme/tokens.css para la
      pila de fuentes del sistema que las sustituye.
    -->
    <link rel="icon" href="%BASE_URL%icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
